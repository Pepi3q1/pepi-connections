<style>
  :root{
    /* dark is the baseline default now, scoped per visual skin below */
    --bg:#06060A; --bg2:#0D0D17;
    --fg:#F2F2F8; --dim:#8C8CA1;
    --glass:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.09);
    --ink:#EDEDF5;
    --wash-o:.55;
    --dust:rgba(255,255,255,.6);
    --shadow:0 40px 120px -40px rgba(0,0,0,.9);
    --accent:#0080F0;
    --accent2:#0080F0;
    --heading-font:"Unbounded","Trebuchet MS",system-ui,sans-serif;
  }

  /* ---- skin: default (the original look) ---- */
  :root[data-skin="default"]{
    --bg:#06060A; --bg2:#0D0D17;
    --fg:#F2F2F8; --dim:#8C8CA1;
    --glass:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.09);
    --ink:#EDEDF5;
    --wash-o:.55;
    --dust:rgba(255,255,255,.6);
    --shadow:0 40px 120px -40px rgba(0,0,0,.9);
    --accent:#0080F0; --accent2:#0080F0;
    --heading-font:"Unbounded","Trebuchet MS",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root[data-skin="default"]:not([data-theme="dark"]){
      --bg:#E9E9F0; --bg2:#FAFAFD;
      --fg:#13131A; --dim:#5D5D6C;
      --glass:rgba(255,255,255,.70);
      --line:rgba(15,15,30,.10);
      --ink:#13131A;
      --wash-o:.30;
      --dust:rgba(25,25,50,.55);
      --shadow:0 30px 80px -34px rgba(20,20,50,.45);
    }
  }
  :root[data-skin="default"][data-theme="light"]{
    --bg:#E9E9F0; --bg2:#FAFAFD;
    --fg:#13131A; --dim:#5D5D6C;
    --glass:rgba(255,255,255,.70);
    --line:rgba(15,15,30,.10);
    --ink:#13131A;
    --wash-o:.30;
    --dust:rgba(25,25,50,.55);
    --shadow:0 30px 80px -34px rgba(20,20,50,.45);
  }

  /* ---- skin: cyberpunk / gaming HUD (dark only) ---- */
  :root[data-skin="hud"]{
    --bg:#02050A; --bg2:#050B10;
    --fg:#E8FBFF; --dim:#5FA8C4;
    --glass:rgba(6,20,28,.22);
    --line:rgba(0,240,255,.28);
    --ink:#E8FBFF;
    --wash-o:.5;
    --dust:rgba(0,240,255,.55);
    --shadow:0 40px 120px -40px rgba(0,180,255,.4);
    --accent:#00F0FF; --accent2:#FF2340;
    --heading-font:"Orbitron","Trebuchet MS",sans-serif;
  }

  /* ---- skin: Elden Ring / dark fantasy (dark only) ---- */
  :root[data-skin="souls"]{
    --bg:#0D0805; --bg2:#1A1006;
    --fg:#F0E6D2; --dim:#A8967A;
    --glass:rgba(40,28,16,.24);
    --line:rgba(212,162,76,.28);
    --ink:#F0E6D2;
    --wash-o:.45;
    --dust:rgba(212,162,76,.55);
    --shadow:0 40px 120px -40px rgba(212,162,76,.35);
    --accent:#D4A24C; --accent2:#8B2635;
    --heading-font:"Cinzel",serif;
  }

  *{box-sizing:border-box}

  .cursor-dot, .cursor-ring{
    position:fixed; top:0; left:0;
    border-radius:50%;
    pointer-events:none;
    z-index:9999;
    opacity:0;
    transition:opacity .3s ease, width .25s ease, height .25s ease, border-color .3s ease;
  }
  .cursor-dot{width:6px; height:6px; background:var(--ink)}
  .cursor-ring{width:34px; height:34px; border:1.5px solid var(--accent); background:transparent}
  body.custom-cursor, body.custom-cursor *{cursor:none !important}
  body.custom-cursor .cursor-dot, body.custom-cursor .cursor-ring{opacity:1}
  body.custom-cursor.cursor-hover .cursor-ring{width:54px; height:54px}
  body.custom-cursor.cursor-hover .cursor-dot{opacity:0}
  html,body{margin:0;padding:0}
  body{
    min-height:100dvh;
    background:var(--bg);
    background-image:radial-gradient(130% 95% at 50% -10%, var(--bg2), var(--bg) 62%);
    background-attachment:fixed;
    color:var(--fg);
    font-family:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display:grid; place-items:center;
    padding:24px 16px;
    overflow-x:hidden;
  }

  /* the room light: takes the colour of whatever you're pointing at */
  .wash{
    position:fixed; left:50%; top:46%;
    width:78vmax; height:66vmax;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background-color:var(--accent);
    opacity:var(--wash-o);
    filter:blur(110px);
    transition:background-color .9s ease, opacity .55s ease;
    pointer-events:none; z-index:0;
  }
  #dust{position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.55}

  #bgVideo{
    position:fixed; inset:0; width:100%; height:100%; object-fit:cover;
    z-index:0; pointer-events:none;
    filter:brightness(.5) saturate(1.15);
    opacity:0;
    transition:opacity 1s ease;
  }
  #bgVideo.show{opacity:1}

  .card{
    position:relative; z-index:2;
    width:min(540px, 100%);
    padding:40px 28px 30px;
    border-radius:30px;
    background:var(--glass);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    backdrop-filter:blur(26px) saturate(1.3);
    -webkit-backdrop-filter:blur(26px) saturate(1.3);
    text-align:center;
    opacity:0; transform:translateY(14px) scale(.985);
    transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.25,1);
  }
  body.ready .card{opacity:1; transform:none}

  .avatar{
    width:104px; height:104px; margin:0 auto 18px;
    border-radius:50%;
    display:grid; place-items:center;
    position:relative;
    background:
      linear-gradient(var(--glass), var(--glass)) padding-box,
      conic-gradient(from 210deg, var(--accent), #35D6FF, #FF5C8A, var(--accent)) border-box;
    border:2px solid transparent;
    box-shadow:0 12px 40px -12px var(--accent);
    overflow:hidden;
  }
  .avatar span{
    font-family:var(--heading-font);
    font-size:38px; line-height:1; color:var(--fg);
  }
  .avatar img{width:100%; height:100%; object-fit:cover; border-radius:50%; display:block}

  h1{
    font-family:var(--heading-font);
    font-weight:600; font-size:clamp(28px,7vw,38px);
    letter-spacing:-.01em; margin:0 0 8px;
  }
  .bio{margin:0 auto 28px; max-width:34ch; color:var(--dim); font-size:15px; line-height:1.55}

  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
  @media (max-width:420px){ .tiles{grid-template-columns:repeat(2,1fr)} }

  .tile{
    all:unset;
    cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px;
    padding:20px 8px;
    border-radius:20px;
    border:1px solid var(--line);
    color:var(--ink);
    background:transparent;
    transition:transform .2s cubic-bezier(.2,.8,.25,1), color .5s ease, border-color .5s ease, background-color .5s ease, box-shadow .5s ease;
    opacity:0; transform:translateY(10px);
  }
  body.ready .tile{opacity:1; transform:none; transition-delay:var(--d)}
  body.ready .tile:hover, body.ready .tile:focus-visible{
    color:color-mix(in srgb, var(--brand) 55%, var(--ink) 45%);
    border-color:color-mix(in srgb, var(--brand) 55%, transparent);
    background-color:color-mix(in srgb, var(--brand) 12%, transparent);
    box-shadow:0 14px 30px -18px color-mix(in srgb, var(--brand) 70%, transparent);
    transform:translateY(-3px); transition-delay:0s;
  }
  body.ready .tile:hover span, body.ready .tile:focus-visible span{
    color:var(--ink);
    transition:color .35s ease;
  }
  .tile:focus-visible{outline:2px solid color-mix(in srgb, var(--brand) 70%, var(--ink)); outline-offset:3px}
  .tile:active{transform:translateY(-1px) scale(.985)}
  .tile svg{width:30px; height:30px; fill:currentColor}

  .tile span{font-size:12.5px; font-weight:500; color:var(--dim); letter-spacing:.01em; transition:color .5s ease}

  .hint{margin:26px 0 0; font-size:12px; color:var(--dim); opacity:.75}

  .enter{
    all:unset;
    position:fixed; inset:0; z-index:20;
    display:grid; place-items:center;
    cursor:pointer;
    background:color-mix(in srgb, var(--bg) 55%, transparent);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    color:var(--fg);
    font-size:14px; letter-spacing:.14em; font-weight:500;
    transition:opacity .55s ease, backdrop-filter .55s ease;
  }
  .enter b{font-weight:500; animation:breathe 2.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.45} 50%{opacity:1}}
  body.ready .enter{opacity:0; pointer-events:none; backdrop-filter:blur(0)}

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%,14px);
    z-index:30;
    padding:10px 16px; border-radius:999px;
    background:var(--glass); border:1px solid var(--line); color:var(--fg);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    font-size:13px; box-shadow:var(--shadow);
    opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}

  .corner-btn{
    position:fixed; top:18px; z-index:15;
    width:42px; height:42px; border-radius:50%;
    display:grid; place-items:center;
    background:var(--glass); border:1px solid var(--line);
    color:var(--ink); cursor:pointer;
    backdrop-filter:blur(20px) saturate(1.3); -webkit-backdrop-filter:blur(20px) saturate(1.3);
    box-shadow:var(--shadow);
    opacity:0; transform:translateY(-8px);
    transition:opacity .5s ease, transform .5s ease, background-color .2s ease, color .2s ease, border-color .2s ease;
  }
  body.ready .corner-btn{opacity:1; transform:none; transition-delay:.15s}
  .corner-btn:hover, .corner-btn:focus-visible{color:var(--accent); border-color:color-mix(in srgb, var(--accent) 50%, transparent)}
  .corner-btn:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
  .corner-btn svg{width:19px; height:19px}
  .share-btn{left:18px}
  .theme-btn{right:18px}

  .player-bar{
    position:fixed; left:50%; bottom:18px; z-index:15;
    transform:translateX(-50%) translateY(10px);
    width:min(520px, 94vw);
    display:flex; align-items:center; gap:14px;
    padding:12px 16px;
    border-radius:20px;
    background:var(--glass); border:1px solid var(--line);
    backdrop-filter:blur(24px) saturate(1.3); -webkit-backdrop-filter:blur(24px) saturate(1.3);
    box-shadow:var(--shadow);
    opacity:0; pointer-events:none;
    transition:opacity .5s ease, transform .5s ease;
  }
  body.ready .player-bar{opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); transition-delay:.2s}
  .player-cover{width:52px; height:52px; border-radius:12px; object-fit:cover; flex:none; background:var(--line)}
  .player-info{flex:1 1 auto; min-width:0}
  .player-title{margin:0; font-size:13.5px; font-weight:600; color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .player-artist{margin:1px 0 6px; font-size:11.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .player-progress{display:flex; align-items:center; gap:7px}
  .player-time{font-size:10px; color:var(--dim); flex:none; min-width:28px}
  .player-progress input[type=range]{flex:1; height:3px; -webkit-appearance:none; appearance:none; background:var(--line); border-radius:999px; outline:none}
  .player-progress input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:10px; height:10px; border-radius:50%; background:var(--accent); cursor:pointer}
  .player-progress input[type=range]::-moz-range-thumb{width:10px; height:10px; border-radius:50%; background:var(--accent); border:none; cursor:pointer}
  .player-controls{display:flex; align-items:center; gap:2px; flex:none}
  .player-controls button, .player-volume button{all:unset; cursor:pointer; display:grid; place-items:center; width:30px; height:30px; border-radius:50%; color:var(--ink); transition:color .2s ease, background-color .2s ease}
  .player-controls button:hover, .player-volume button:hover{color:var(--accent); background-color:color-mix(in srgb, var(--accent) 14%, transparent)}
  .player-controls svg{width:17px; height:17px}
  #playerPlayPause svg{width:19px; height:19px}
  .player-volume{display:flex; align-items:center; gap:6px; flex:none}
  .player-volume input[type=range]{width:60px; height:3px; -webkit-appearance:none; appearance:none; background:var(--line); border-radius:999px; outline:none}
  .player-volume input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:10px; height:10px; border-radius:50%; background:var(--ink); cursor:pointer}
  .player-volume input[type=range]::-moz-range-thumb{width:10px; height:10px; border-radius:50%; background:var(--ink); border:none; cursor:pointer}
  .player-volume svg{width:16px; height:16px}
  @media (max-width:480px){ .player-volume{display:none} }

  .status-badge{
    display:inline-flex; align-items:center; gap:7px;
    margin:-6px auto 18px;
    padding:7px 13px;
    border-radius:999px;
    background:rgba(255,255,255,.02); border:1px solid var(--line);
    font-size:12.5px; color:var(--fg);
    box-shadow:0 10px 28px -18px rgba(0,0,0,.6);
  }
  .status-badge[hidden]{display:none}
  .status-dot{width:8px; height:8px; border-radius:50%; flex:none; box-shadow:0 0 0 3px rgba(255,255,255,.06)}

  .qr-overlay{
    position:fixed; inset:0; z-index:40;
    display:grid; place-items:center;
    padding:20px;
    background:color-mix(in srgb, var(--bg) 60%, transparent);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
  }
  .qr-overlay.show{opacity:1; pointer-events:auto}
  .qr-panel{
    width:min(280px, 100%);
    padding:26px;
    border-radius:24px;
    background:var(--glass); border:1px solid var(--line);
    box-shadow:var(--shadow);
    backdrop-filter:blur(26px) saturate(1.3); -webkit-backdrop-filter:blur(26px) saturate(1.3);
    text-align:center;
  }
  .qr-panel canvas{display:block; margin:0 auto 16px; border-radius:12px; background:#fff; padding:10px}
  .qr-panel .url-text{margin:0 0 16px; font-size:12px; color:var(--dim); word-break:break-all}
  .qr-actions{display:flex; gap:10px; justify-content:center}
  .mini-btn{
    all:unset; cursor:pointer;
    padding:9px 17px; border-radius:999px;
    border:1px solid var(--line); font-size:13px; color:var(--ink);
    transition:color .2s ease, border-color .2s ease, background-color .2s ease;
  }
  .mini-btn:hover, .mini-btn:focus-visible{
    color:var(--accent); border-color:color-mix(in srgb, var(--accent) 50%, transparent);
    background-color:color-mix(in srgb, var(--accent) 12%, transparent);
  }
  .mini-btn:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

  .extra-btns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:22px}

  .setup-btn{
    all:unset; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 18px;
    border-radius:999px;
    border:1px solid var(--line);
    color:var(--ink); font-size:13px; font-weight:500;
    background:rgba(255,255,255,.02);
    transition:color .2s ease, border-color .2s ease, background-color .2s ease, transform .2s ease;
  }
  .setup-btn:hover, .setup-btn:focus-visible{
    color:var(--accent); border-color:color-mix(in srgb, var(--accent) 50%, transparent);
    background-color:color-mix(in srgb, var(--accent) 12%, transparent);
    transform:translateY(-1px);
  }
  .setup-btn:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
  .setup-btn svg{width:16px; height:16px}

  .setup-panel{width:min(420px, 92vw); padding:32px 30px; text-align:left; max-height:80vh; overflow-y:auto;
    scrollbar-width:thin; scrollbar-color:var(--line) transparent;}
  .setup-panel::-webkit-scrollbar{width:6px}
  .setup-panel::-webkit-scrollbar-track{background:transparent}
  .setup-panel::-webkit-scrollbar-thumb{background:color-mix(in srgb, var(--accent) 45%, transparent); border-radius:999px}
  .setup-panel::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb, var(--accent) 70%, transparent)}
  .setup-title{
    margin:0 0 18px; text-align:center;
    font-family:var(--heading-font);
    font-size:19px; font-weight:600; color:var(--fg);
  }
  .setup-list{list-style:none; margin:0 0 20px; padding:0; display:flex; flex-direction:column}
  .setup-list li{display:flex; flex-direction:column; gap:5px; padding:13px 2px; border-bottom:1px solid var(--line)}
  .setup-list li:last-child{border-bottom:none}
  .setup-list .k{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim)}
  .setup-list .v{font-size:15px; font-weight:600; color:var(--fg); line-height:1.4}
  .setup-panel .qr-actions{justify-content:center}

  /* keep decorative corner/ember markers out of normal flow regardless of active skin */
  .card > .corner, .card > .ember{position:absolute; pointer-events:none}

  /* let the background video read through the panels instead of being buried under heavy blur */
  [data-skin="hud"] .card, [data-skin="souls"] .card{
    backdrop-filter:blur(10px) saturate(1.25); -webkit-backdrop-filter:blur(10px) saturate(1.25);
  }
  [data-skin="hud"] .player-bar, [data-skin="souls"] .player-bar{
    backdrop-filter:blur(10px) saturate(1.25); -webkit-backdrop-filter:blur(10px) saturate(1.25);
  }
  [data-skin="hud"] .qr-panel, [data-skin="souls"] .qr-panel{
    backdrop-filter:blur(10px) saturate(1.25); -webkit-backdrop-filter:blur(10px) saturate(1.25);
  }
  [data-skin="hud"] .corner-btn, [data-skin="souls"] .corner-btn{
    backdrop-filter:blur(8px) saturate(1.25); -webkit-backdrop-filter:blur(8px) saturate(1.25);
  }

  /* ===================== SKIN: shape & decoration ===================== */

  /* -- skin switcher control -- */
  .skin-switch{display:flex; gap:8px; justify-content:center; margin:0 0 22px}
  .skin-btn{
    all:unset; cursor:pointer;
    width:34px; height:34px; border-radius:50%;
    display:grid; place-items:center;
    border:1.5px solid var(--line); color:var(--dim);
    transition:.25s;
  }
  .skin-btn svg{width:16px; height:16px}
  .skin-btn:hover{color:var(--ink); border-color:var(--ink)}
  .skin-btn[aria-pressed="true"]{color:var(--accent); border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent)}

  /* -- HUD: angular card, corner brackets, scanlines -- */
  [data-skin="hud"] .card{
    border-radius:2px;
    clip-path:polygon(0 18px,18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%);
    background:
      repeating-linear-gradient(0deg, rgba(0,240,255,.02) 0px, rgba(0,240,255,.02) 1px, transparent 1px, transparent 3px),
      var(--glass);
  }
  [data-skin="hud"] .card::before, [data-skin="hud"] .card::after{
    content:""; position:absolute; width:22px; height:22px;
    border-top:2px solid var(--accent2); border-left:2px solid var(--accent2);
    pointer-events:none;
  }
  [data-skin="hud"] .card::before{top:10px; left:10px}
  [data-skin="hud"] .card::after{bottom:10px; right:10px; transform:rotate(180deg)}
  [data-skin="hud"] .avatar{
    border-radius:0;

    border-radius:0;

  [data-skin="hud"] .theme-btn{display:none}

  /* -- Elden Ring: ornamented card, vine avatar frame, ember accents -- */
  [data-skin="souls"] .card{border-radius:4px; position:relative; overflow:hidden}
  [data-skin="souls"] .card::before, [data-skin="souls"] .card::after{
    content:""; position:absolute; width:24px; height:24px; pointer-events:none;
  }
  [data-skin="souls"] .card > .corner{position:absolute; width:24px; height:24px; pointer-events:none}
  [data-skin="souls"] .card > .corner::before, [data-skin="souls"] .card > .corner::after{content:""; position:absolute; background:color-mix(in srgb, var(--accent) 70%, transparent)}
  [data-skin="souls"] .card > .corner::before{width:100%; height:1.5px; top:0; left:0}
  [data-skin="souls"] .card > .corner::after{width:1.5px; height:100%; top:0; left:0}
  [data-skin="souls"] .card > .corner.tl{top:9px; left:9px}
  [data-skin="souls"] .card > .corner.tr{top:9px; right:9px; transform:scaleX(-1)}
  [data-skin="souls"] .card > .corner.bl{bottom:9px; left:9px; transform:scaleY(-1)}
  [data-skin="souls"] .card > .corner.br{bottom:9px; right:9px; transform:scale(-1,-1)}
  [data-skin="souls"] .card > .ember{position:absolute; border-radius:50%; background:var(--accent); filter:blur(.5px); opacity:.5; pointer-events:none}
  [data-skin="souls"] .avatar{box-shadow:0 0 22px -4px var(--accent)}
  [data-skin="souls"] .avatar-frame{display:block !important}
  [data-skin="souls"] h1{text-shadow:0 0 18px color-mix(in srgb, var(--accent) 45%, transparent)}
  [data-skin="souls"] .name-divider{display:flex !important}
  [data-skin="souls"] .bio{font-style:italic}
  [data-skin="souls"] .tile{border-radius:3px; position:relative}
  [data-skin="souls"] .tile::before{content:""; position:absolute; inset:3px; border:1px solid color-mix(in srgb, var(--accent) 16%, transparent); pointer-events:none}
  [data-skin="souls"] .tile span{font-family:"Cinzel",serif}
  [data-skin="souls"] .theme-btn{display:none}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition-duration:.01ms !important}
    .card,.tile{opacity:1; transform:none}

const $ = id => document.getElementById(id);
const wash = $("wash"), toast = $("toast");

function applySkinAccentOverride(){
  const skin = document.documentElement.getAttribute("data-skin") || "default";
  if (skin === "default") document.documentElement.style.setProperty("--accent", PROFILE.accent);
  else document.documentElement.style.removeProperty("--accent");
}
applySkinAccentOverride();
document.title = PROFILE.name;
$("name").textContent = PROFILE.name;
$("bio").textContent = PROFILE.bio;

const tiles = $("tiles");
LINKS.forEach((l, i) => {
  const el = document.createElement(l.url ? "a" : "button");
  el.className = "tile";
  el.style.setProperty("--brand", l.color);
  el.style.setProperty("--d", (i * 55) + "ms");
  if (l.url) {
    el.href = l.url; el.target = "_blank"; el.rel = "noopener noreferrer";
    el.setAttribute("aria-label", "Open " + l.label);
  } else {
    el.type = "button"; el.dataset.copy = l.copy;
    el.setAttribute("aria-label", "Copy my " + l.label + " username");
  }
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", ICONS[l.label] || "");
  svg.appendChild(p);
  const cap = document.createElement("span");
  cap.textContent = l.label;
  el.append(svg, cap);
  tiles.appendChild(el);
});

/* the tile itself shows the hover color (border/icon); the background glow no longer reacts to hover */
const lit = c => { wash.style.backgroundColor = c; };
function restingWashColor(){
  const skin = document.documentElement.getAttribute("data-skin") || "default";
  return skin === "default" ? PROFILE.accent : "transparent";
}
function applyRestingWash(){ lit(restingWashColor()); }
applyRestingWash();
const findTile = e => e.target.closest(".tile");

/* copy-only accounts */
let toastTimer;
tiles.addEventListener("click", async e => {
  const t = findTile(e);
  if (!t || !t.dataset.copy) return;
  const text = t.dataset.copy;
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch {}
    ta.remove();
  }
  toast.textContent = "Copied " + text;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1900);
});

/* enter screen */
const enter = $("enter");
const open = () => {
  if (document.body.classList.contains("ready")) return;
  document.body.classList.add("ready");
  setTimeout(() => enter.remove(), 700);
};
enter.addEventListener("click", open);
document.addEventListener("pointerdown", (event) => {
  if (document.body.classList.contains("ready")) return;
  if (event.target && event.target.closest(".enter")) return;
  open();
}, { passive: true });
window.addEventListener("keydown", function onKey(e){
  if (document.body.classList.contains("ready")) return;
  if (e.key === "Tab") return;
  open();
}, true);

/* slow drifting dust */
(() => {
  const c = $("dust"), ctx = c.getContext("2d");
  const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, dpr, dots = [];
  const color = () => getComputedStyle(document.documentElement).getPropertyValue("--dust").trim();
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr;
    c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px";
    dots = Array.from({length: Math.round(innerWidth * innerHeight / 26000) + 18}, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: (Math.random() * 1.3 + .4) * dpr,
      v: (Math.random() * .18 + .05) * dpr,
      a: Math.random() * .5 + .12
    }));
  }
  function frame(){
    ctx.clearRect(0, 0, w, h);
    const col = color();
    for (const d of dots){
      d.y -= d.v; if (d.y < -4) { d.y = h + 4; d.x = Math.random() * w; }
      ctx.globalAlpha = d.a; ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (!still) requestAnimationFrame(frame);
  }
  size(); frame();
  addEventListener("resize", () => { size(); if (still) frame(); });
})();

/* theme toggle — remembers an explicit choice, otherwise follows the system */
const themeBtn = $("themeBtn");
const SUN_SVG  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
const MOON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>';
function storedTheme(){ try { return localStorage.getItem("theme"); } catch { return null; } }
function systemPrefersDark(){ return window.matchMedia("(prefers-color-scheme: dark)").matches; }
function effectiveTheme(){ const s = storedTheme(); return (s === "light" || s === "dark") ? s : (systemPrefersDark() ? "dark" : "light"); }
function paintThemeIcon(){
  const t = effectiveTheme();
  themeBtn.innerHTML = t === "dark" ? SUN_SVG : MOON_SVG;
  themeBtn.setAttribute("aria-label", t === "dark" ? "Switch to light theme" : "Switch to dark theme");
}
function applyStoredTheme(){
  const s = storedTheme();
  if (s === "light" || s === "dark") document.documentElement.setAttribute("data-theme", s);
  else document.documentElement.removeAttribute("data-theme");
  paintThemeIcon();
}
applyStoredTheme();
themeBtn.addEventListener("click", () => {
  const next = effectiveTheme() === "dark" ? "light" : "dark";
  try { localStorage.setItem("theme", next); } catch {}
  applyStoredTheme();
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!storedTheme()) paintThemeIcon(); });

/* share via QR code */

$("shareBtn").addEventListener("click", openQR);
$("qrCloseBtn").addEventListener("click", closeQR);
qrOverlay.addEventListener("click", e => { if (e.target === qrOverlay) closeQR(); });
window.addEventListener("keydown", e => { if (e.key === "Escape") closeQR(); });
$("qrCopyBtn").addEventListener("click", async () => {

    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch {}
    ta.remove();
  }
  toast.textContent = "Copied link";
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1900);
});

/* live Discord status via Lanyard — stays hidden unless PROFILE.discordId is set and reachable */
const STATUS_COLORS = { online:"#3BA55D", idle:"#FAA61A", dnd:"#ED4245", offline:"#80848E" };
const STATUS_LABELS = { online:"Online", idle:"Away", dnd:"Do not disturb", offline:"Offline" };
async function refreshDiscordStatus(){
  if (!PROFILE.discordId) return;
  try {
    const res = await fetch("https://api.lanyard.rest/v1/users/" + PROFILE.discordId);
    const json = await res.json();
    if (!json.success) return;
    const d = json.data;
    const status = d.discord_status || "offline";
    const game = (d.activities || []).find(a => a.type === 0);
    $("statusDot").style.background = STATUS_COLORS[status] || STATUS_COLORS.offline;
    $("statusText").textContent = game ? (STATUS_LABELS[status] + " \u00B7 Playing " + game.name) : STATUS_LABELS[status];
    $("statusBadge").hidden = false;
  } catch { /* Lanyard unreachable or blocked — badge just stays hidden */ }
}
if (PROFILE.discordId) {
  refreshDiscordStatus();
  setInterval(refreshDiscordStatus, 30000);
}

  const k = document.createElement("span"); k.className = "k"; k.textContent = s.label;
  const v = document.createElement("span"); v.className = "v"; v.textContent = s.value;
  li.append(k, v);
  setupList.appendChild(li);
});
const setupOverlay = $("setupOverlay");
function openSetup(){ setupOverlay.classList.add("show"); }
function closeSetup(){ setupOverlay.classList.remove("show"); }
$("setupBtn").addEventListener("click", openSetup);
$("setupCloseBtn").addEventListener("click", closeSetup);
setupOverlay.addEventListener("click", e => { if (e.target === setupOverlay) closeSetup(); });
window.addEventListener("keydown", e => { if (e.key === "Escape") closeSetup(); });

/* "My sensitivity" — edit the list below with your real numbers */
const SENSITIVITY = [
  { label:"DPI",               value:"1600" },
  { label:"Polling Rate",      value:"1000" },
  { label:"HipFire/360°",      value:"32cm" },
  { label:"ADS/360°",          value:"42cm" },
  { label:"Counter-Strike 2",  value:"0.62" },
  { label:"Fortnite",          value:"3.2" },
  { label:"Roblox",            value:"0.2" }
];
const sensList = $("sensList");
SENSITIVITY.forEach(s => {
  const li = document.createElement("li");
  const k = document.createElement("span"); k.className = "k"; k.textContent = s.label;
  const v = document.createElement("span"); v.className = "v"; v.textContent = s.value;
  li.append(k, v);
  sensList.appendChild(li);
});
const sensOverlay = $("sensOverlay");
function openSens(){ sensOverlay.classList.add("show"); }
function closeSens(){ sensOverlay.classList.remove("show"); }
$("sensBtn").addEventListener("click", openSens);
$("sensCloseBtn").addEventListener("click", closeSens);
sensOverlay.addEventListener("click", e => { if (e.target === sensOverlay) closeSens(); });
window.addEventListener("keydown", e => { if (e.key === "Escape") closeSens(); });

/* music player — add your own track(s); one item plays, more become a playlist with Prev/Next */
const TRACKS = [
  { title:"Mad Sounds", artist:"Arctic Monkeys", cover:"cover-default.jpg", src:"track-default.mp3" },
  { title:"The Ballad of Buck Ravers", artist:"SAMURAI", cover:"cover-hud.jpg", src:"track-hud.mp3" },
  { title:"Covet", artist:"Basement", cover:"cover-souls.jpg", src:"track-souls.mp3" }
];
const TRACK_INDEX_BY_SKIN = { default:0, hud:1, souls:2 };
let trackIndex = 0;
const playerAudio = $("playerAudio");
const playerCover = $("playerCover"), playerTitle = $("playerTitle"), playerArtist = $("playerArtist");
const playerSeek = $("playerSeek"), playerCurrent = $("playerCurrent"), playerDuration = $("playerDuration");
const playerPlayPause = $("playerPlayPause"), playerVolume = $("playerVolume"), playerMute = $("playerMute");

const PLAY_ICON  = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>';
const VOL_ICON   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19.07 4.93a10 10 0 010 14.14"/></svg>';
const MUTE_ICON  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
$("playerPrev").innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5L9 12l11 7z"/></svg>';
$("playerNext").innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg>';
playerPlayPause.innerHTML = PLAY_ICON;
playerMute.innerHTML = VOL_ICON;

function fmtTime(sec){
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}
function loadTrack(i, autoplay){
  trackIndex = ((i % TRACKS.length) + TRACKS.length) % TRACKS.length;
  const t = TRACKS[trackIndex];
  playerCover.src = t.cover || "avatar.jpg";
  playerCover.alt = t.title || "";
  playerTitle.textContent = t.title || "Untitled";
  playerArtist.textContent = t.artist || "";
  playerAudio.src = t.src || "";
  playerSeek.value = 0;
  playerCurrent.textContent = "0:00";
  playerDuration.textContent = "0:00";
  playerPlayPause.innerHTML = PLAY_ICON;
  playerPlayPause.setAttribute("aria-label", "Play");
  if (autoplay && t.src) {
    playerAudio.play().then(() => {
      playerPlayPause.innerHTML = PAUSE_ICON;
      playerPlayPause.setAttribute("aria-label", "Pause");
    }).catch(() => {});
  }
}
loadTrack(0, false);

playerPlayPause.addEventListener("click", () => {
  if (!playerAudio.src) return;
  if (playerAudio.paused) {
    playerAudio.play().then(() => {
      playerPlayPause.innerHTML = PAUSE_ICON;
      playerPlayPause.setAttribute("aria-label", "Pause");
    }).catch(() => {});
  } else {
    playerAudio.pause();
    playerPlayPause.innerHTML = PLAY_ICON;
    playerPlayPause.setAttribute("aria-label", "Play");
  }
});
$("playerPrev").addEventListener("click", () => loadTrack(trackIndex - 1, !playerAudio.paused));
$("playerNext").addEventListener("click", () => loadTrack(trackIndex + 1, !playerAudio.paused));

/* keyboard shortcuts: space = play/pause, left/right arrows = prev/next track */
window.addEventListener("keydown", e => {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (!document.body.classList.contains("ready")) return;
  if (e.key === " " || e.code === "Space") {
    e.preventDefault();
    playerPlayPause.click();
  } else if (e.key === "ArrowRight") {
    $("playerNext").click();
  } else if (e.key === "ArrowLeft") {
    $("playerPrev").click();
  }
});

playerAudio.addEventListener("loadedmetadata", () => {
  playerDuration.textContent = fmtTime(playerAudio.duration);
  playerSeek.max = playerAudio.duration || 0;
});
playerAudio.addEventListener("timeupdate", () => {
  playerCurrent.textContent = fmtTime(playerAudio.currentTime);
  playerSeek.value = playerAudio.currentTime;
});
playerAudio.addEventListener("ended", () => { loadTrack(trackIndex + 1, true); });
playerSeek.addEventListener("input", () => { playerAudio.currentTime = playerSeek.value; });

playerAudio.volume = parseFloat(playerVolume.value || "0.5");
playerVolume.addEventListener("input", () => {
  playerAudio.volume = parseFloat(playerVolume.value);
  playerAudio.muted = false;
  playerMute.innerHTML = playerAudio.volume === 0 ? MUTE_ICON : VOL_ICON;
});
playerMute.addEventListener("click", () => {
  playerAudio.muted = !playerAudio.muted;
  playerMute.innerHTML = playerAudio.muted ? MUTE_ICON : VOL_ICON;
});

/* start the first track right when the visitor enters — that click counts as the user gesture browsers require */
let _musicStarted = false;
new MutationObserver(() => {
  if (!_musicStarted && document.body.classList.contains("ready")) {
    _musicStarted = true;
    if (TRACKS[trackIndex] && TRACKS[trackIndex].src) loadTrack(trackIndex, true);
  }
}).observe(document.body, { attributes:true, attributeFilter:["class"] });

/* visual theme (skin) switcher — Default / Cyberpunk HUD / Elden Ring */
const SKIN_KEY = "skin";
const skinButtons = { default: $("skinDefaultBtn"), hud: $("skinHudBtn"), souls: $("skinSoulsBtn") };
const DEFAULT_AVATAR_SRC = $("avatarImg").getAttribute("src");
const AVATAR_BY_SKIN = { default: DEFAULT_AVATAR_SRC, hud: "avatar-hud.gif", souls: "avatar-souls.jpg" };

function applySkinAvatar(skin){
  const img = $("avatarImg");
  img.onerror = () => { img.onerror = null; img.src = DEFAULT_AVATAR_SRC; };
  img.src = AVATAR_BY_SKIN[skin] || DEFAULT_AVATAR_SRC;
}

const BG_VIDEO_BY_SKIN = { hud: "bg-hud.webm", souls: "bg-souls.webm" };
const bgVideo = $("bgVideo");
bgVideo.addEventListener("error", () => bgVideo.classList.remove("show"));

function applySkinBackground(skin){
  const src = BG_VIDEO_BY_SKIN[skin];
  if (!src) {
    bgVideo.classList.remove("show");
    bgVideo.pause();
    bgVideo.removeAttribute("src");
    return;
  }
  if (bgVideo.getAttribute("src") !== src) {
    bgVideo.src = src;
    bgVideo.load();
  }
  bgVideo.play().then(() => bgVideo.classList.add("show")).catch(() => {});
}

function applySkin(skin, persist){
  if (!skinButtons[skin]) skin = "default";
  document.documentElement.setAttribute("data-skin", skin);
  Object.entries(skinButtons).forEach(([name, btn]) => btn.setAttribute("aria-pressed", name === skin ? "true" : "false"));
  applySkinAccentOverride();
  applyRestingWash();
  applySkinAvatar(skin);
  applySkinBackground(skin);
  const idx = TRACK_INDEX_BY_SKIN[skin];
  if (idx !== undefined && idx !== trackIndex) loadTrack(idx, document.body.classList.contains("ready"));
  if (persist) { try { localStorage.setItem(SKIN_KEY, skin); } catch {} }
}

let storedSkin = "default";
try { storedSkin = localStorage.getItem(SKIN_KEY) || "default"; } catch {}
applySkin(storedSkin, false);

skinButtons.default.addEventListener("click", () => applySkin("default", true));
skinButtons.hud.addEventListener("click", () => applySkin("hud", true));
skinButtons.souls.addEventListener("click", () => applySkin("souls", true));
</script>
