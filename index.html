<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pepi | Links</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
  <div id="enter">
  <span>click to enter</span>
  </div>

  <main class="profile">

    <img class="avatar" src="images/avatar.jpg" alt="Profile picture">
    <h1>Pepi</h1>
    <p class="bio" id="bio"></p>
    <button class="setup-btn" id="setup-btn"><i class="fa-solid fa-desktop"></i> My setup</button>
<nav class="links" id="links">
</nav>
  </main>

<div class="player-bar" id="playerBar">
  <img class="player-cover" id="playerCover" src="images/cover1.jpg" alt="">
  <div class="player-info">
    <p class="player-title" id="playerTitle">Song name</p>
    <p class="player-artist" id="playerArtist">Artist</p>
    <div class="player-progress">
      <span class="player-time" id="playerCurrent">0:00</span>
      <input type="range" id="playerSeek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
      <span class="player-time" id="playerDuration">0:00</span>
    </div>
  </div>
  <div class="player-controls">
    <button id="playerPrev" type="button" aria-label="Previous track"></button>
    <button id="playerPlayPause" type="button" aria-label="Play"></button>
    <button id="playerNext" type="button" aria-label="Next track"></button>
  </div>
  <div class="player-volume">
    <button id="playerMute" type="button" aria-label="Mute"></button>
    <input type="range" id="playerVolume" min="0" max="1" step="0.01" value="0.5" aria-label="Volume">
  </div>
  <audio id="playerAudio" preload="metadata"></audio>
</div>

<div class="modal" id="setup-modal">
  <div class="modal-card">
    <button class="modal-close" id="setup-close" aria-label="Close">x</button>
    <h2>My setup</h2>
    <dl id="setup-list"></dl>
  </div>
</div>

    <script src="script.js"></script>

  </body>
</html>
